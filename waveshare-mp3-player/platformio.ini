[env:waveshare-speaker-test]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DPLAYER_USB_DRIVE=1
    -Iinclude
lib_deps = earlephilhower/ESP8266Audio@1.9.7
monitor_speed = 115200
upload_port = COM15
upload_speed = 921600

; Compile-tested candidate only: validate audio underruns/touch on hardware
; before choosing it for a battery build. The default retains 240 MHz.
[env:battery-candidate]
extends = env:waveshare-speaker-test
board_build.f_cpu = 160000000L

; Headphone conversion: stereo output and capped earbud gain (see PlayerConfig.h).
; Not hardware-tested; start with the volume knob at its lowest.
[env:earbuds]
extends = env:waveshare-speaker-test
build_flags =
    ${env:waveshare-speaker-test.build_flags}
    -DPLAYER_EARBUDS=1
